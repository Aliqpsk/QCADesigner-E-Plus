name: Windows baseline build

on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout QCADesigner-E-Plus with upstream submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtk2
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-autotools
            make
            pkgconf

      - name: Configure QCADesigner-E for Windows
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: |
          chmod +x configure
          ./configure --host=x86_64-w64-mingw32 --build=x86_64-w64-mingw32 --prefix="$PWD/build/install"
          sed -i 's/-lintl//g' Makefile src/Makefile

      - name: Build QCADesigner-E for Windows
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: make -j"$(nproc)"

      - name: Verify Windows executable
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: |
          test -f src/QCADesigner.exe
          file src/QCADesigner.exe

      - name: Package Windows baseline
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: |
          rm -rf "$GITHUB_WORKSPACE/build/windows"
          mkdir -p "$GITHUB_WORKSPACE/build/windows"
          cp src/QCADesigner.exe "$GITHUB_WORKSPACE/build/windows/"
          ldd src/QCADesigner.exe | awk '/\/mingw64\/bin/ {print $3}' | while read -r dll; do
            [ -f "$dll" ] && cp -n "$dll" "$GITHUB_WORKSPACE/build/windows/"
          done

      - name: Upload Windows baseline
        uses: actions/upload-artifact@v4
        with:
          name: qcadesigner-e-windows-baseline
          path: build/windows/
