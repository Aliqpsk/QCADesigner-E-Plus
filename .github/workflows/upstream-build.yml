name: Upstream baseline and Plus engine build

on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  build-upstream:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout QCADesigner-E-Plus with upstream submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            gettext \
            libgtk2.0-dev \
            libtool \
            pkg-config \
            xvfb

      - name: Configure upstream QCADesigner-E
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: |
          chmod +x configure
          ./configure --prefix="$GITHUB_WORKSPACE/build/install"

      - name: Build upstream QCADesigner-E
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: make -j"$(nproc)"

      - name: Verify upstream executable
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: |
          test -x src/QCADesigner
          file src/QCADesigner

      - name: GUI smoke test with sample QCA design
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: |
          set +e
          timeout 8s xvfb-run -a ./src/QCADesigner ./sample.qca > "$GITHUB_WORKSPACE/qcadesigner-smoke.log" 2>&1
          status=$?
          set -e
          cat "$GITHUB_WORKSPACE/qcadesigner-smoke.log"
          if [ "$status" -ne 124 ]; then
            echo "QCADesigner exited unexpectedly with status $status"
            exit "$status"
          fi
          echo "QCADesigner remained alive under Xvfb for the smoke-test window."

      - name: Stage build artifact
        run: |
          mkdir -p build/artifact
          cp upstream/QCADesigner-E/QCADesignerE/src/QCADesigner build/artifact/QCADesigner

      - name: Upload baseline executable
        uses: actions/upload-artifact@v4
        with:
          name: qcadesigner-e-baseline
          path: build/artifact/QCADesigner

  build-plus-engine:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout QCADesigner-E-Plus with upstream submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            gettext \
            libgtk2.0-dev \
            libtool \
            pkg-config \
            xvfb

      - name: Materialize development engine from pinned upstream
        run: |
          chmod +x scripts/materialize-engine.sh
          scripts/materialize-engine.sh
          test -f engine/QCADesigner-E/QCADesignerE/configure
          test -f engine/QCADesigner-E/UPSTREAM_BASELINE.txt

      - name: Configure Plus development engine
        working-directory: engine/QCADesigner-E/QCADesignerE
        run: |
          chmod +x configure
          ./configure --prefix="$GITHUB_WORKSPACE/build/plus-install"

      - name: Build Plus development engine
        working-directory: engine/QCADesigner-E/QCADesignerE
        run: make -j"$(nproc)"

      - name: Verify Plus executable comes from engine tree
        working-directory: engine/QCADesigner-E/QCADesignerE
        run: |
          test -x src/QCADesigner
          file src/QCADesigner
          test -f ../UPSTREAM_BASELINE.txt

      - name: Plus GUI smoke test with sample QCA design
        working-directory: engine/QCADesigner-E/QCADesignerE
        run: |
          set +e
          timeout 8s xvfb-run -a ./src/QCADesigner ./sample.qca > "$GITHUB_WORKSPACE/qcadesigner-plus-smoke.log" 2>&1
          status=$?
          set -e
          cat "$GITHUB_WORKSPACE/qcadesigner-plus-smoke.log"
          if [ "$status" -ne 124 ]; then
            echo "Plus QCADesigner exited unexpectedly with status $status"
            exit "$status"
          fi
          echo "Plus engine remained alive under Xvfb for the smoke-test window."

      - name: Upload Plus engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcadesigner-e-plus-engine
          path: engine/QCADesigner-E/QCADesignerE/src/QCADesigner

  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout QCADesigner-E-Plus with upstream submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtk2
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-autotools
            make
            pkgconf

      - name: Configure QCADesigner-E for Windows
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: |
          chmod +x configure
          ./configure --host=x86_64-w64-mingw32 --build=x86_64-w64-mingw32 --prefix="$PWD/build/install"
          sed -i 's/-lintl//g' Makefile src/Makefile

      - name: Build QCADesigner-E for Windows
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: make -j"$(nproc)"

      - name: Verify Windows executable
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: |
          test -f src/QCADesigner.exe
          file src/QCADesigner.exe

      - name: Package Windows baseline
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: |
          rm -rf "$GITHUB_WORKSPACE/build/windows"
          mkdir -p "$GITHUB_WORKSPACE/build/windows"
          cp src/QCADesigner.exe "$GITHUB_WORKSPACE/build/windows/"
          ldd src/QCADesigner.exe | awk '/\/mingw64\/bin/ {print $3}' | while read -r dll; do
            [ -f "$dll" ] && cp -n "$dll" "$GITHUB_WORKSPACE/build/windows/"
          done

      - name: Upload Windows baseline
        uses: actions/upload-artifact@v4
        with:
          name: qcadesigner-e-windows-baseline
          path: build/windows/
