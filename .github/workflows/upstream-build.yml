name: Upstream baseline build

on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  build-upstream:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout QCADesigner-E-Plus with upstream submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            gettext \
            libgtk2.0-dev \
            libtool \
            pkg-config

      - name: Configure upstream QCADesigner-E
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: |
          chmod +x configure
          ./configure --prefix="$GITHUB_WORKSPACE/build/install"

      - name: Build upstream QCADesigner-E
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: make -j"$(nproc)"

      - name: Verify upstream executable
        working-directory: upstream/QCADesigner-E/QCADesignerE
        run: |
          test -x src/QCADesigner
          file src/QCADesigner

      - name: Stage build artifact
        run: |
          mkdir -p build/artifact
          cp upstream/QCADesigner-E/QCADesignerE/src/QCADesigner build/artifact/QCADesigner

      - name: Upload baseline executable
        uses: actions/upload-artifact@v4
        with:
          name: qcadesigner-e-baseline
          path: build/artifact/QCADesigner
